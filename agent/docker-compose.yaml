version: '3.8'

services:
  # 1. Ollama LLM Engine
  ollama:
    image: ollama/ollama:latest
    container_name: ollama_service
    restart: always
    ports:
      - "11434:11434"
    environment:
      - OLLAMA_HOST=0.0.0.0
      - OLLAMA_KEEP_ALIVE=24h
      - HTTP_PROXY=http://10.47.203.33:3128
      - HTTPS_PROXY=http://10.47.203.33:3128
      - http_proxy=http://10.47.203.33:3128
      - https_proxy=http://10.47.203.33:3128
      - NO_PROXY=localhost,127.0.0.1,10.244.9.203,10.244.9.207
      - no_proxy=localhost,127.0.0.1,10.244.9.203,10.244.9.207
    volumes:
      - ollama_storage:/root/.ollama
    # Uncomment if NVIDIA GPU is available
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  # 2. Jenkins Automation Server
  jenkins:
    image: jenkins/jenkins:lts
    container_name: jenkins_service
    restart: always
    ports:
      - "8080:8080"
      - "50000:50000"
    volumes:
      - jenkins_storage:/var/jenkins_home
    environment:
      - HTTP_PROXY=http://10.47.203.33:3128
      - HTTPS_PROXY=http://10.47.203.33:3128
      - http_proxy=http://10.47.203.33:3128
      - https_proxy=http://10.47.203.33:3128
      - NO_PROXY=localhost,127.0.0.1,jenkins
      - no_proxy=localhost,127.0.0.1,jenkins
      - JAVA_OPTS=-Dhttp.proxyHost=10.47.203.33 -Dhttp.proxyPort=3128 -Dhttps.proxyHost=10.47.203.33 -Dhttps.proxyPort=3128 -Dhudson.model.DirectoryBrowserSupport.CSP= -Djsse.enableSNIExtension=false -Dcom.sun.net.ssl.checkRevocation=false -Djava.net.preferIPv4Stack=true
  # 3. Grafana Monitoring Dashboards
  grafana:
    image: grafana/grafana:latest
    container_name: grafana_service
    restart: always
    ports:
      - "3000:3000"
    volumes:
      - grafana_storage:/var/lib/grafana

  # 4. Prometheus Metrics Collector
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus_service
    restart: always
    ports:
      - "9090:9090"
    volumes:
      - prometheus_storage:/etc/prometheus

  # 5. MySQL Database
  mysql:
    image: mysql:8.0
    container_name: mysql_service
    restart: always
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root_password_change_me
      MYSQL_DATABASE: app_db
    volumes:
      - mysql_storage:/var/lib/mysql

# Persistent storage volumes
volumes:
  ollama_storage:
  jenkins_storage:
  grafana_storage:
  prometheus_storage:
  mysql_storage: