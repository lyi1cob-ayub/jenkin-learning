version: '3.8'

services:
  # 1. Ollama LLM Engine
  ollama:
    image: ollama/ollama:latest
    container_name: ollama_service
    restart: always
    ports:
      - "11434:11434"
    environment:
      - OLLAMA_HOST=0.0.0.0
      - OLLAMA_KEEP_ALIVE=24h
      - HTTP_PROXY=http://10.47.203.33:3128
      - HTTPS_PROXY=http://10.47.203.33:3128
      - http_proxy=http://10.47.203.33:3128
      - https_proxy=http://10.47.203.33:3128
      - NO_PROXY=localhost,127.0.0.1,10.244.9.203,10.244.9.207
      - no_proxy=localhost,127.0.0.1,10.244.9.203,10.244.9.207
    volumes:
      - ollama_storage:/root/.ollama
    # Uncomment if NVIDIA GPU is available
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  # 2. Jenkins Automation Server
  jenkins:
    image: jenkins/jenkins:lts
    container_name: jenkins_service
    restart: always
    ports:
      - "8080:8080"
      - "50000:50000"
    volumes:
      - jenkins_storage:/var/jenkins_home
    environment:
      - HTTP_PROXY=http://10.47.203.33:3128
      - HTTPS_PROXY=http://10.47.203.33:3128
      - http_proxy=http://10.47.203.33:3128
      - https_proxy=http://10.47.203.33:3128
      - NO_PROXY=localhost,127.0.0.1,jenkins
      - no_proxy=localhost,127.0.0.1,jenkins
      - JAVA_OPTS=-Dhttp.proxyHost=10.47.203.33 -Dhttp.proxyPort=3128 -Dhttps.proxyHost=10.47.203.33 -Dhttps.proxyPort=3128 -Dhudson.model.DirectoryBrowserSupport.CSP= -Djsse.enableSNIExtension=false -Dcom.sun.net.ssl.checkRevocation=false -Djava.net.preferIPv4Stack=true
  # 3. Grafana Monitoring Dashboards
  grafana:
    image: grafana/grafana:latest
    container_name: rca_grafana
    restart: always
    ports:
      - "3000:3000"
    environment:
      - HTTP_PROXY=http://10.47.203.33:3128
      - HTTPS_PROXY=http://10.47.203.33:3128
      - http_proxy=http://10.47.203.33:3128
      - https_proxy=http://10.47.203.33:3128
      - NO_PROXY=localhost,127.0.0.1,prometheus_service,prometheus,10.244.9.208
      - no_proxy=localhost,127.0.0.1,prometheus_service,prometheus,10.244.9.208
    volumes:
      - grafana_storage:/var/lib/grafana

  # 4. Prometheus Metrics Collector
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus_service
    restart: always
    ports:
      - "9090:9090"
    environment:
      - HTTP_PROXY=http://10.47.203.33:3128
      - HTTPS_PROXY=http://10.47.203.33:3128
      - http_proxy=http://10.47.203.33:3128
      - https_proxy=http://10.47.203.33:3128
      - NO_PROXY=localhost,127.0.0.1,host.docker.internal,10.244.9.208,10.244.10.234,172.17.0.1
      - no_proxy=localhost,127.0.0.1,host.docker.internal,10.244.9.208,10.244.10.234,172.17.0.1
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    extra_hosts:
      - "host.docker.internal:host-gateway"
  # 5. MySQL Database
  mysql:
    image: mysql:8.0
    container_name: mysql_service
    restart: always
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root_password_change_me
      MYSQL_DATABASE: app_db
    volumes:
      - mysql_storage:/var/lib/mysql
  langfuse_db:
    image: postgres:16-alpine
    container_name: langfuse_db
    restart: always
    environment:
      POSTGRES_USER: langfuse
      POSTGRES_PASSWORD: langfuse_db_password
      POSTGRES_DB: langfuse
    volumes:
      - langfuse_db_storage:/var/lib/postgresql/data

  # Langfuse Analytics & Web Dashboard
  langfuse:
    image: langfuse/langfuse:2
    container_name: langfuse_service
    restart: always
    depends_on:
      - langfuse_db
    ports:
      - "3001:3000"
    environment:
      - DATABASE_URL=postgresql://langfuse:langfuse_db_password@langfuse_db:5432/langfuse
      - NEXTAUTH_URL=http://localhost:3001
      - NEXTAUTH_SECRET=secret_key_for_langfuse_auth_change_me
      - SALT=random_salt_string_change_me
      - TELEMETRY_ENABLED=false
      - HTTP_PROXY=http://10.47.203.33:3128
      - HTTPS_PROXY=http://10.47.203.33:3128
      - http_proxy=http://10.47.203.33:3128
      - https_proxy=http://10.47.203.33:3128
      - NO_PROXY=localhost,127.0.0.1,langfuse_db,ollama_service,10.244.9.203,10.244.9.207,10.244.9.208
      - no_proxy=localhost,127.0.0.1,langfuse_db,ollama_service,10.244.9.203,10.244.9.207,10.244.9.208

# Persistent storage volumes
volumes:
  ollama_storage:
  jenkins_storage:
  grafana_storage:
  prometheus_storage:
  mysql_storage:
  langfuse_db_storage: